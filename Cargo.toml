[package]
name = "y720-kbled"
version = "0.1.0"
edition = "2021"
description = "Keyboard backlight control for the Lenovo Legion Y720"
license = "ISC"
rust-version = "1.77"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
evdev = "0.13"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
