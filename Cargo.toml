[package]
name = "y720-kbled"
version = "1.1.2"
edition = "2021"
description = "Keyboard backlight control for the Lenovo Legion Y720"
license = "ISC"
rust-version = "1.80"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
evdev = "0.13"
# 0.9 stays on the GTK 4.0 API unless a v4_* feature is enabled. v4_14 matches
# Ubuntu 24.04's GTK 4.14, so a binary built on a newer GTK still runs there.
gtk = { package = "gtk4", version = "0.9", default-features = false, features = ["v4_14"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
