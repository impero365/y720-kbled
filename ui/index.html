<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y720 Keyboard LEDs</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>Y720 Keyboard LEDs</h1>
    <div class="profiles">
      <select id="profile" aria-label="Profile"></select>
      <button id="add" type="button">Add</button>
      <button id="rename" type="button">Rename</button>
      <button id="delete" type="button">Delete</button>
    </div>
  </header>
  <p id="notice" class="notice" hidden></p>
  <main>
    <section>
      <h2>Zones</h2>
      <div id="zones" class="zones"></div>
      <p class="hint">Left to right, then the numpad. Click a zone, then pick a color and brightness.</p>
    </section>
    <section>
      <h2>Color</h2>
      <div id="colors" class="colors"></div>
    </section>
    <section class="split">
      <div>
        <h2>Brightness</h2>
        <div id="brightness" class="choices"></div>
        <button id="all-brightness" type="button">Apply this brightness to every zone</button>
      </div>
      <div>
        <h2>Style</h2>
        <div id="modes" class="choices"></div>
      </div>
    </section>
  </main>
  <dialog id="name-dialog">
    <form method="dialog">
      <p id="name-label">Profile name</p>
      <input id="name-input" required maxlength="40">
      <div class="dialog-actions">
        <button value="cancel" type="submit">Cancel</button>
        <button value="ok" type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
